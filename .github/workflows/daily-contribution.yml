name: Daily Contribution

on:
  schedule:
    - cron: "0 7 * * *"   # 8am Paris CET / 9am CEST
  workflow_dispatch:        # manual trigger from GitHub UI or phone

permissions:
  contents: read

jobs:
  contribute:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run daily contribution
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}   # free key from console.groq.com
          LLM_URL: ${{ vars.LLM_URL }}               # optional: other OpenAI-compatible API
          MODELS: ${{ vars.MODELS }}
        run: python scripts/contribute.py
