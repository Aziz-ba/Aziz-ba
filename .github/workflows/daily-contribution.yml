name: Daily Contribution

on:
  # Several tries per day (UTC). Each run exits early if a commit already
  # exists today, so only the first successful one contributes.
  schedule:
    - cron: "0 7 * * *"    # 9am Paris (CEST)
    - cron: "0 11 * * *"   # 1pm
    - cron: "0 15 * * *"   # 5pm
    - cron: "0 19 * * *"   # 9pm
    - cron: "30 21 * * *"  # 11:30pm, last chance before midnight UTC
  workflow_dispatch:        # manual trigger from GitHub UI or phone
    inputs:
      dry_run:
        description: "Test only: show the change, do not push"
        type: boolean
        default: false
      repo:
        description: "Optional: start with this repo (e.g. infrastructure-as-code)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  contribute:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Run daily contribution
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}   # free key (Gemini: aistudio.google.com/apikey)
          LLM_URL: ${{ vars.LLM_URL }}               # optional: other OpenAI-compatible API
          MODELS: ${{ vars.MODELS }}
          DRY_RUN: ${{ inputs.dry_run }}
          REPO: ${{ inputs.repo }}
        run: python scripts/contribute.py
