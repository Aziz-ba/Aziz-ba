name: Daily Contribution

on:
  schedule:
    - cron: "0 7 * * *"   # 8am Paris CET / 9am CEST
  workflow_dispatch:        # manual trigger from GitHub UI or phone

permissions:
  contents: read
  models: read             # free GitHub Models inference with GITHUB_TOKEN

jobs:
  contribute:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run daily contribution
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODELS: ${{ vars.MODELS }}
        run: python scripts/contribute.py
