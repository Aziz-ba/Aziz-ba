name: Daily Contribution

on:
  schedule:
    - cron: "0 7 * * *"   # 8am Paris CET / 9am CEST
  workflow_dispatch:        # manual trigger from GitHub UI or phone

jobs:
  contribute:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install anthropic --quiet

      - name: Run daily contribution
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python scripts/contribute.py
